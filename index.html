
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Systemas Koffy's</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 h-screen flex flex-col items-center justify-center p-4">
    
    <div class="mb-8 text-center text-white">
        <h1 class="text-4xl font-black italic tracking-tighter uppercase">Systemas Koffy's</h1>
        <p class="text-blue-400 text-[10px] uppercase tracking-[0.4em] font-bold">Control Territorial D6</p>
    </div>

    <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-sm border border-white/20">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-slate-800 italic">¡Hola, bienvenido!</h2>
            <p class="text-slate-400 text-sm">Ingresa tus credenciales de acceso</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Usuario</label>
                <input type="text" id="u" required placeholder="User / Root" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <div>
                <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Contraseña</label>
                <input type="password" id="p" required placeholder="******" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-95 uppercase text-xs tracking-widest">
                ENTRAR AL SISTEMA
            </button>
        </form>
        <p id="err" class="text-red-500 text-[10px] text-center mt-4 font-bold hidden uppercase tracking-tighter italic">Credenciales Incorrectas</p>
    </div>

    <footer class="mt-12 text-slate-500 text-[9px] uppercase tracking-[0.5em]">
        Desarrollado por Systemas Koffy's & Gemini AI
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('u').value;
            const p = document.getElementById('p').value;

            // Validación Nivel 1 y Nivel 2
            if ((u === 'User' && p === '123abc') || (u === 'Root' && p === 'Password')) {
                localStorage.setItem('auth_d6', 'true');
                localStorage.setItem('user_role', u);
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('err').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
